<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Pro v10.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .page { display: none; }
        .page.active { display: block; }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <div id="syncStatus" class="fixed top-4 right-4 z-50 text-[10px] bg-black text-white px-3 py-1 rounded-full opacity-0 transition-all">同步中...</div>

    <div id="page-home" class="page active p-6 max-w-md mx-auto">
        <div class="flex justify-between items-center mb-8 pt-4">
            <h1 class="text-3xl font-black italic tracking-tighter">POCKETS.</h1>
            <button onclick="resetKey()" class="text-[10px] bg-white border px-2 py-1 rounded-lg text-slate-400">重设钥匙</button>
        </div>

        <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl mb-8">
            <p class="text-slate-400 text-xs font-bold uppercase mb-2">资产合计</p>
            <h2 id="grandTotal" class="text-4xl font-mono font-bold italic">¥ 0.00</h2>
        </div>

        <div class="space-y-4 mb-10">
            <h3 class="font-black text-sm text-slate-400 uppercase tracking-widest">快速入口</h3>
            <div onclick="openDailyWallet()" class="bg-indigo-600 p-6 rounded-[2rem] shadow-lg text-white flex justify-between items-center active:scale-95 transition-all">
                <div>
                    <p class="text-xl font-bold">日常记账</p>
                    <p class="text-xs opacity-70">登记每日零碎支出</p>
                </div>
                <div class="text-2xl">→</div>
            </div>
            
            <div onclick="showPage('page-flexible')" class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex justify-between items-center active:scale-95 transition-all">
                <div>
                    <p class="text-lg font-bold">可灵活支配金额</p>
                    <p class="text-xs text-slate-400">结余与支配建议</p>
                </div>
                <div class="text-slate-300">→</div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h3 class="font-black text-sm text-slate-400 uppercase tracking-widest">专项荷包</h3>
            <button onclick="createNewWallet()" class="text-indigo-600 font-bold text-xs">+ 新增荷包</button>
        </div>

        <div id="walletGrid" class="grid grid-cols-2 gap-4 pb-10"></div>
    </div>

    <div id="page-detail" class="page p-6 max-w-md mx-auto">
        <div class="flex items-center justify-between mb-6">
            <button onclick="showPage('page-home')" class="p-2 -ml-2 text-slate-400 font-bold">← 返回</button>
            <h2 id="currentWalletName" class="text-xl font-black text-center flex-1">荷包详情</h2>
            <div class="w-10"></div>
        </div>

        <div class="bg-white rounded-[2rem] p-8 shadow-xl border border-slate-100 mb-8 text-center">
            <p class="text-slate-400 text-[10px] font-bold uppercase mb-1">余额</p>
            <h3 id="currentBalance" class="text-4xl font-mono font-bold">¥ 0.00</h3>
        </div>

        <div class="bg-white rounded-[2.5rem] p-6 shadow-lg border border-slate-100 mb-8 space-y-4">
            <input type="text" id="itemName" class="w-full bg-slate-50 border-none rounded-2xl p-4 outline-none" placeholder="项目（如：午饭、退款）">
            <div class="flex gap-2">
                <input type="number" id="itemAmount" inputmode="decimal" class="flex-1 bg-slate-50 border-none rounded-2xl p-4 font-mono text-xl outline-none" placeholder="0.00">
                <select id="itemType" class="bg-slate-50 border-none rounded-2xl px-2 font-bold text-xs outline-none">
                    <option value="expense">支出</option>
                    <option value="income">存入</option>
                    <option value="refund">退款</option>
                    <option value="reimburse">报销</option>
                </select>
            </div>
            <button onclick="saveRecord()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black">确认登记</button>
        </div>

        <div id="recordList" class="space-y-3 pb-20"></div>
    </div>

    <div id="page-flexible" class="page p-6 max-w-md mx-auto">
        <button onclick="showPage('page-home')" class="mb-6 text-slate-400 font-bold">← 返回首页</button>
        <h2 class="text-2xl font-black mb-6">可灵活支配</h2>
        <div class="bg-emerald-500 rounded-[2rem] p-8 text-white mb-6">
            <p class="opacity-70 text-xs">当前剩余可支配</p>
            <h3 id="flexBalance" class="text-4xl font-mono font-bold">¥ 0.00</h3>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border text-sm text-slate-500 italic">
            这里会根据你的“日常记账”荷包余额自动计算。
        </div>
    </div>

    <script>
        // ================= 配置区 =================
        const REPO_OWNER = 'Zz-zZhou'; 
        const REPO_NAME = 'my-wallet'; 
        const DATA_FILE = 'data.json'; 
        // ==========================================

        let appData = { wallets: [] };
        let activeWalletId = null;

        function getToken() {
            let k = localStorage.getItem('gh_token');
            if(!k) { k = prompt("请输入 Token:"); if(k) localStorage.setItem('gh_token', k); }
            return k;
        }
        function resetKey() { localStorage.removeItem('gh_token'); location.reload(); }

        async function sync(method, data = null) {
            const token = getToken(); if(!token) return null;
            toggleSync(true);
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`;
            const headers = { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' };
            
            let sha = null;
            try {
                const res = await fetch(url, { headers });
                if(res.ok) {
                    const json = await res.json();
                    sha = json.sha;
                    if(method === 'GET') {
                        toggleSync(false);
                        return JSON.parse(decodeURIComponent(escape(atob(json.content))));
                    }
                }
            } catch(e) {}

            if(method === 'PUT') {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify({ message: 'update', content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))), sha: sha })
                });
                toggleSync(false);
                return res.ok;
            }
            toggleSync(false);
        }

        async function init() {
            const remote = await sync('GET');
            if(remote) {
                appData = remote;
            } else {
                // 初始化：自动创建“日常记账”荷包
                appData.wallets = [{ id: 'daily', name: '日常记账', records: [], color: 'bg-indigo-500' }];
            }
            renderHome();
        }

        function renderHome() {
            const grid = document.getElementById('walletGrid');
            grid.innerHTML = '';
            let total = 0;
            appData.wallets.forEach(w => {
                const bal = calculateBalance(w);
                total += bal;
                // 首页的专项荷包列表（排除掉日常记账，因为它已有独立大入口）
                if(w.id !== 'daily') {
                    grid.innerHTML += `
                        <div onclick="openWallet('${w.id}')" class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 active:scale-95 transition-all">
                            <div class="w-6 h-6 ${w.color} rounded-full mb-2"></div>
                            <p class="text-slate-400 text-[10px] font-black">${w.name}</p>
                            <p class="text-lg font-mono font-bold italic">¥${bal.toFixed(2)}</p>
                        </div>`;
                }
            });
            document.getElementById('grandTotal').innerText = `¥ ${total.toFixed(2)}`;
            const daily = appData.wallets.find(x => x.id === 'daily');
            document.getElementById('flexBalance').innerText = `¥ ${calculateBalance(daily).toFixed(2)}`;
        }

        function openDailyWallet() { openWallet('daily'); }

        function openWallet(id) {
            activeWalletId = id;
            const w = appData.wallets.find(x => x.id === id);
            document.getElementById('currentWalletName').innerText = w.name;
            showPage('page-detail');
            renderDetail();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'page-home') renderHome();
        }

        function createNewWallet() {
            const name = prompt("荷包名称:");
            if(!name) return;
            const newW = { id: Date.now().toString(), name, records: [], color: 'bg-emerald-400' };
            appData.wallets.push(newW);
            renderHome();
            sync('PUT', appData);
        }

        async function saveRecord() {
            const name = document.getElementById('itemName').value || "未命名";
            const amt = parseFloat(document.getElementById('itemAmount').value);
            const type = document.getElementById('itemType').value;
            if(isNaN(amt)) return;
            const w = appData.wallets.find(x => x.id === activeWalletId);
            w.records.unshift({ id: Date.now(), name, amt, type, date: new Date().toLocaleString() });
            renderDetail();
            await sync('PUT', appData);
            document.getElementById('itemName').value = '';
            document.getElementById('itemAmount').value = '';
        }

        function renderDetail() {
            const w = appData.wallets.find(x => x.id === activeWalletId);
            const list = document.getElementById('recordList');
            list.innerHTML = '';
            w.records.forEach(r => {
                const isPlus = (r.type !== 'expense');
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-50 flex justify-between items-center shadow-sm">
                        <div><p class="font-bold text-sm">${r.name}</p><p class="text-[9px] text-slate-300">${r.date}</p></div>
                        <p class="${isPlus?'text-emerald-500':'text-red-500'} font-mono font-bold">${isPlus?'+':'-'}¥${r.amt.toFixed(2)}</p>
                    </div>`;
            });
            document.getElementById('currentBalance').innerText = `¥ ${calculateBalance(w).toFixed(2)}`;
        }

        function calculateBalance(w) {
            return w.records.reduce((sum, r) => (r.type === 'expense' ? sum - r.amt : sum + r.amt), 0);
        }

        function toggleSync(show) { document.getElementById('syncStatus').style.opacity = show ? 1 : 0; }

        window.onload = init;
    </script>
</body>
</html>
