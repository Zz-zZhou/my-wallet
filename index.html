<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>粥粥酱的资金管家 v9.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-md mx-auto p-6">
        <div id="status" class="fixed top-4 right-4 text-[10px] bg-slate-900 text-white px-3 py-1 rounded-full opacity-0 transition-opacity">同步中...</div>
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black">我的钱包</h1>
            <button onclick="resetKey()" class="text-[10px] text-slate-400 border border-slate-200 px-2 py-1 rounded">重设钥匙</button>
        </div>
        
        <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl mb-6">
            <p class="text-slate-400 text-xs font-bold">云端同步总额</p>
            <h2 id="total" class="text-4xl font-mono font-bold">¥ 0.00</h2>
        </div>

        <div class="bg-white rounded-[2rem] p-5 shadow-lg border border-slate-100 mb-6 space-y-3">
            <input type="text" id="item" class="w-full bg-slate-50 border-none rounded-xl p-3 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="支出项目">
            <input type="number" id="amount" inputmode="decimal" class="w-full bg-slate-50 border-none rounded-xl p-3 font-mono outline-none focus:ring-2 focus:ring-indigo-500" placeholder="0.00">
            <button onclick="addRecord()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black shadow-lg active:scale-95 transition-transform">确认存入云端</button>
        </div>

        <div id="list" class="space-y-3 h-[400px] overflow-y-auto pb-10"></div>
    </div>

    <script>
        // ================= 配置区 (代码里不存 Token) =================
        const REPO_OWNER = 'Zz-zZhou'; 
        const REPO_NAME = 'my-wallet'; 
        const DATA_FILE = 'data.json'; 
        // ===========================================================

        let records = [];

        // 获取 Token：先从本地拿，拿不到就弹窗问你要
        function getToken() {
            let key = localStorage.getItem('gh_wallet_token');
            if (!key) {
                key = prompt("为了安全，请粘贴你的 GitHub Token (ghp_开头的那串):");
                if (key) localStorage.setItem('gh_wallet_token', key);
            }
            return key;
        }

        // 重设钥匙的功能
        function resetKey() {
            localStorage.removeItem('gh_wallet_token');
            location.reload();
        }

        async function api(method, body = null) {
            const token = getToken();
            if (!token) return alert("没有钥匙，无法同步数据！");

            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`;
            const headers = { 
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            };
            
            let sha = null;
            try {
                const getRes = await fetch(url, { headers });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                    if (method === 'GET') return JSON.parse(decodeURIComponent(escape(atob(getData.content))));
                }
            } catch (e) {}

            if (method === 'PUT') {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify({
                        message: 'update data',
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(body)))),
                        sha: sha
                    })
                });
                return res.ok;
            }
        }

        async function load() {
            toggleStatus(true);
            const data = await api('GET');
            if (data) records = data;
            render();
            toggleStatus(false);
        }

        async function addRecord() {
            const item = document.getElementById('item').value;
            const amt = parseFloat(document.getElementById('amount').value);
            if (!item || isNaN(amt)) return alert("请填写完整！");

            records.unshift({ item, amt, time: new Date().toLocaleString() });
            render();
            toggleStatus(true);
            const success = await api('PUT', records);
            if (!success) alert("同步失败，请检查 Token 权限或网络");
            toggleStatus(false);
            document.getElementById('item').value = '';
            document.getElementById('amount').value = '';
        }

        function render() {
            const list = document.getElementById('list');
            list.innerHTML = '';
            let total = 0;
            records.forEach(r => {
                total -= r.amt;
                list.innerHTML += `<div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between shadow-sm animate-in slide-in-from-top duration-300">
                    <div><p class="font-bold text-sm text-slate-700">${r.item}</p><p class="text-[9px] text-slate-300 italic">${r.time}</p></div>
                    <p class="text-red-500 font-mono font-bold">-¥${r.amt.toFixed(2)}</p>
                </div>`;
            });
            document.getElementById('total').innerText = `¥ ${total.toFixed(2)}`;
        }

        function toggleStatus(show) { document.getElementById('status').style.opacity = show ? 1 : 0; }

        window.onload = load;
    </script>
</body>
</html>
